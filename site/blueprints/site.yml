title: Site

columns:
  main:
    width: 2/3
    sections:
      sectionHedaline:
        type: fields
        fields:
          sectionHedaline:
            label: Website Pages
            type: headline
      pages:
        type: pages
        templates: 
          - page
          - library
        create:
          - page
          - library
      temporary:
        type: pages
        max: 1
        templates: 
          - landing-page       
  sidebar:
    width: 1/3
    sections:
      footer:
        type: fields
        fields:
          footerHeadline:
            label: Footer
            type: headline
            # help: Shown at the bottom of every page. The copyright year updates automatically.
          address:
            label: Address
            type: textarea
            buttons: false
            size: small
          email:
            label: Email
            type: email
            translate: false
          socials:
            label: Social media
            type: structure
            translate: false
            columns:
              platform: true
              url: true
            fields:
              platform:
                label: Platform
                type: select
                required: true
                options:
                  instagram: Instagram
                  facebook: Facebook
                  x: X
                  tiktok: TikTok
                  substack: Substack
                  linkedin: LinkedIn
                  youtube: YouTube
                  vimeo: Vimeo
                  other: Other
              label:
                label: Name
                type: text
                when:
                  platform: other
                help: Shown as text, since there's no icon for it.
              url:
                label: Link
                type: url
                required: true
      additional:
        type: pages
        templates: 
          - text
        create:
          - text

