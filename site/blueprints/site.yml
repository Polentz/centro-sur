title: Site

tabs:
  content:
    label: Content
    icon: page
    columns:
      main:
        width: 2/3
        sections:
          sectionHedaline:
            type: fields
            fields:
              sectionHedaline:
                label: Website Pages
                type: headline
          pages:
            type: pages
            templates:
              - home
              - page
            create:
              - page
          temporary:
            type: pages
            max: 1
            templates:
              - landing-page
      sidebar:
        width: 1/3
        sections:
          # launch:
          #   type: fields
          #   fields:
          #     launched:
          #       label: Website is live
          #       type: toggle
          #       text:
          #         - "No – visitors see the landing page"
          #         - "Yes – visitors see the full website"
          #       translate: false
          #       help: "While off, the public address shows the landing page. The full site is always available for review at <code>review.</code> + your domain."
          footer:
            type: fields
            fields:
              footerHeadline:
                label: Footer
                type: headline
                help: Shown at the bottom of every page. The copyright year updates automatically.
              address:
                label: Address
                type: textarea
                buttons: false
                size: small
              email:
                label: Email
                type: email
                translate: false
              socials:
                label: Social media
                type: structure
                translate: false
                columns:
                  platform: true
                  url: true
                fields:
                  platform:
                    label: Platform
                    type: select
                    required: true
                    options:
                      instagram: Instagram
                      facebook: Facebook
                      x: X
                      tiktok: TikTok
                      substack: Substack
                      linkedin: LinkedIn
                      youtube: YouTube
                      vimeo: Vimeo
                      other: Other
                  label:
                    label: Name
                    type: text
                    when:
                      platform: other
                    help: Shown as text, since there's no icon for it.
                  url:
                    label: Link
                    type: url
                    required: true
          additional:
            label: Additional Pages
            type: pages
            templates:
              - text
            create:
              - text
  seo:
    label: SEO
    icon: search
    fields:
      description:
        label: SEO Description
        type: textarea
        buttons: false
      keywords:
        label:
          en: SEO Keywords
          it: Parole chiave  
        type: tags
        separator: ','
      ogImage:
        label: SEO Social Sharing Image
        type: files
        multiple: false
        query: site.images
        uploads: image
        image:
          cover: true
          ratio: 1200/630
          back: white
        help: Shown when the site is shared on social media or in chats. Best at 1200 × 630 px (JPG or PNG).
      favicon:
        label: Favicon
        type: files
        multiple: false
        query: site.images
        uploads: image
        image:
          cover: false
          ratio: 1/1
          back: white
        help: Shown in browser tabs and as the home screen icon on phones. Use a square image, at least 180 × 180 px (PNG recommended).