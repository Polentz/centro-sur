title: Library item
icon: book

columns:
  main:
    width: 2/3
    sections:
      details:
        type: fields
        fields:
          author:
            label: Author
            type: text
            width: 1/2
            translate: false
          year:
            label: Year
            type: text
            width: 1/4
            translate: false
          format:
            label: Format
            type: text
            width: 1/4
            placeholder: Book, Catalogue, Zine…
          description:
            label: Description
            type: writer
            nodes:
              - paragraph
              - bulletList
              - orderedList
            marks:
              - bold
              - italic
              - underline
              - link
              - email
              - clear
          link:
            label: External link
            type: url
            translate: false
  sidebar:
    width: 1/3
    sections:
      media:
        type: fields
        fields:
          illustration:
            label: Illustration
            type: files
            max: 1
            multiple: false
            translate: false
            template: illustration
            uploads: illustration
            query: page.images
          attachments: fields/attachments
