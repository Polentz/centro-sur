title: Content page
image: icon
icon: page

columns:
  main:
    width: 2/3
    sections:
      content:
        type: fields
        fields:
          sections:
            label: Sections
            type: blocks
            empty: No sections yet. Add one to start building the page.
            fieldsets:
              - split
  sidebar:
    width: 1/3
    sections:
      illustrations:
        label: Images
        type: files
        template: illustration
        layout: cards
        image:
          back: white
      attachments:
        label: Downloads
        type: files
        help: Upload here the pdf files you want to use as attachments on this page.
        template: document
        uploads: document
        query: page.files.filterBy("type", "document")
        link: false


