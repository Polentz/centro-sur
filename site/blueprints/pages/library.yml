title: Library
icon: book

columns:
  main:
    width: 2/3
    sections:
      content:
        type: fields
        fields:
          entries:
            label: Titles
            type: blocks
            fieldsets:
              - library-item
            empty: No titles yet
  sidebar:
    width: 1/3
    sections:
      settings:
        type: fields
        fields:
          illustration:
            label: Default illustration
            type: files
            max: 1
            multiple: false
            translate: false
            template: illustration
            uploads: illustration
            query: page.images
            help: Shown in an open title when it has no image of its own.
