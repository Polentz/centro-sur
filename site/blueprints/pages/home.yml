title: Landing Page

columns:
  main:
    width: 3/4
    sections:
      intro:
        type: fields
        fields:
          logo:
            label: Section Logo
            type: files
            width: 1/2
            max: 1
            template: svg
            uploads: svg
            query: page.files.filterBy("type", "svg")
          intro:
            label: Introduction text
            type: writer
            width: 1/2
            marks:
              - bold
              - italic
              - underline
              - strike
              - link
              - email
              - clear
            nodes: false           
      gallery:
        type: fields
        fields:
          grid:
            label: Section
            type: layout
            layouts:
              - "1/4, 1/4, 1/4, 1/4"
              - "1/2, 1/2"
              - "1/1"
            fieldsets:
              - image
              - text
  sidebar:
    width: 1/4
    sections:
      features:
        label: false
        type: fields
        fields:
          attachments: fields/attachments